html{-webkit-text-size-adjust:100%}html,body{max-width:100%;overflow-x:hidden}body{min-height:100vh;min-height:100dvh}
button{white-space:normal;max-width:100%;overflow-wrap:anywhere;transition:transform .08s steps(2),box-shadow .08s steps(2);box-shadow:3px 4px 0 var(--sh)}
button:hover{transform:translateY(2px);box-shadow:2px 2px 0 var(--sh),inset 0 2px 0 rgba(0,0,0,.18)}

V['Save Guide']=()=>`<div class="bx"><h2>Back up and move devices</h2><p>Use these buttons to save a copy of your progress or load it on another device.</p><div class="row"><button class="g" data-z="ex">⬇ Export backup</button><button data-z="imp">⬆ Import backup file</button></div><p id="bk"></p><label>Backup text: copy it to keep, or paste a backup here</label><textarea id="bt" rows="4"></textarea><div class="row"><button data-z="imt">Load pasted backup</button></div><h3>Moving to another device</h3><p>Your progress lives only in the browser it was saved in, so a new phone or laptop starts blank. There is no sync and no account.</p><ol><li>On the old device, tap <b>Export backup</b>. A small backup file downloads (if it doesn’t, copy the backup text instead).</li><li>Send the file to yourself by email, Messenger, Google Drive, or USB.</li><li>On the new device, open the same website, tap <b>Import backup file</b>, pick the file (or paste the text and tap <b>Load pasted backup</b>). Your grades, schedules, RSS hours and notes appear.</li></ol><p>You can also export before clearing browser data or switching browsers. A backup only holds your progress as of the last export, and two devices won’t update each other automatically. Automatic syncing needs a server and accounts, which this free site doesn’t have. Backups from the earlier BIT CompTech and any-department versions also load here.</p></div><div class="bx"><h2>Delete my data</h2><p>Imported the wrong profile? You can erase everything stored on this device and start over.</p><div class="row"><button class="dng" data-z="del">🗑 Delete all my data</button></div></div><div class="bx"><h2>How your progress is saved</h2><p>Progress saves automatically in your own browser, with no account or save button. To keep it safe:</p><ul><li><b>Use the same device and browser every time.</b> Progress doesn’t sync, so a phone and a laptop each have their own separate copy.</li><li><b>Don’t use private/incognito mode.</b> Everything is erased when that window closes.</li><li><b>Don’t clear browsing data.</b> Clearing cookies or “site data” deletes your progress. Some browsers, such as Safari on iPhone, may also clear it if the site goes unused for a long time.</li><li><b>Keep using the same link.</b> Your data is tied to the web address, so a different link or a changed address starts you from a blank page.</li><li><b>Check for the “✔ Saved on this device” message</b> near the top of the page. If it shows a warning instead, your browser is blocking storage or it is full, which can happen after adding many images in Notes.</li></ul></div><div class="bx"><h2>Use it offline</h2><p>LLCC Study Quest can work without internet once it is installed.</p><ol><li>Open the site in <b>Chrome</b> while you are online.</li><li>Tap <b>⋮</b> (menu), then <b>Install app</b> (or <b>Add to Home screen</b>). If you see the ⬇ Install app button in the side menu, you can tap that instead.</li><li>Open it once from your home screen while online so it can save itself. After that it works offline.</li></ol><p>Your progress is saved on your device either way, and the music is made inside the app, so it plays offline too.</p></div>`;
