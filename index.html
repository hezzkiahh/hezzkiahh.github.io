V['Save Guide']=()=>`<div class="bx"><h2>Back up and move devices</h2><p>Use these buttons to save a copy of your progress or load it on another device.</p><div class="row"><button class="g" data-z="ex">⬇ Export backup</button><button data-z="imp">⬆ Import backup file</button></div><input type="file" id="bf" accept=".json,application/json" hidden><p id="bk"></p><label>Backup text: copy it to keep, or paste a backup here</label><textarea id="bt" rows="4"></textarea><div class="row"><button data-z="imt">Load pasted backup</button></div><h3>Moving to another device</h3><p>Your progress lives only in the browser it was saved in, so a new phone or laptop starts blank. There is no sync and no account.</p><ol><li>On the old device, tap <b>Export backup</b>. A small backup file downloads (if it doesn’t, copy the backup text instead).</li><li>Send the file to yourself by email, Messenger, Google Drive or USB.</li><li>On the new device, open the same website, tap <b>Import backup file</b>, pick the file (or paste the text and tap <b>Load pasted backup</b>). Your grades, schedules, RSS hours and notes appear.</li></ol><p>You can also export before clearing browser data or switching browsers. A backup only holds your progress as of the last export, and two devices won’t update each other automatically. Automatic syncing needs a server and accounts, which this free site doesn’t have. A backup only loads into the same version of this site it came from.</p></div><div class="bx"><h2>How your progress is saved</h2><p>Progress saves automatically in your own browser, with no account or save button. To keep it safe:</p><ul><li><b>Use the same device and browser every time.</b> Progress doesn’t sync, so a phone and a laptop each have their own separate copy.</li><li><b>Don’t use private/incognito mode.</b> Everything is erased when that window closes.</li><li><b>Don’t clear browsing data.</b> Clearing cookies or “site data” deletes your progress. Some browsers, such as Safari on iPhone, may also clear it if the site goes unused for a long time.</li><li><b>Keep using the same link.</b> Your data is tied to the web address, so a different link or a changed address starts you from a blank page.</li><li><b>Check for the “✔ Saved on this device” message</b> near the top of the page. If it shows a warning instead, your browser is blocking storage or it is full, which can happen after adding many images in Notes.</li></ul></div>`;
